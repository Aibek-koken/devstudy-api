apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devstudy-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Aibek-koken/devstudy-api
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: m5
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
